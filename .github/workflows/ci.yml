name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        opt: [none, speed]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-10

      - name: ALSA headers and library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Optional fire:link (GPL Ableton Link, fetched at a pinned tag and never
      # committed). Without it tests/link is skipped.
      - name: Build Ableton Link
        shell: bash
        run: ./scripts/link.sh

      - name: Test
        shell: bash
        env:
          FIRE_OPT: ${{ matrix.opt }}
        run: ./scripts/test.sh

      - name: Examples build and run
        if: matrix.opt == 'none'
        shell: bash
        run: ./scripts/examples.sh

      - name: API reference is current and complete
        if: matrix.opt == 'none' && runner.os != 'Windows'
        shell: bash
        run: ./scripts/docs.sh --check

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}-${{ matrix.opt }}
          path: .test_artifacts/
          if-no-files-found: ignore
