# The application layer (app/) and the apps built on it (apps/). Builds
# link SDL3 and Dear ImGui statically, so each app is one executable; run
# `task deps` once first.
#
#   task app:pads             build .build/app/pads (optimized)
#   task app:run              build and run Pads
#   task app:drive -- FILE    run Pads with a drive script (input events and screenshots)
#   task app:test             test app:core, app:ui and Pads headless (and the e2e suite)
#   task app:e2e              the end-to-end suite: Pads used as a person uses it (tests/e2e, pytest)
#   task app:ctl              Pads under remote control: type drive commands, see answers and crashes
#   task app:gallery          the widget gallery (to review the look)
version: '3'

vars:
  OUT: '{{.ROOT_DIR}}/.build/app'
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  COLLECTIONS: -collection:fire={{.ROOT_DIR}}/f_engine -collection:app={{.ROOT_DIR}}/app -collection:deps={{.ROOT_DIR}}/vendor
  # Pads (GPL-3.0-or-later) has Ableton Link built in when its library is
  # there (./scripts/link.sh, which `task deps` runs); LINK=0 leaves it out,
  # LINK=1 insists on it.
  LINK:
    sh: 'for f in {{.ROOT_DIR}}/third_party/link/lib/*abl_link*; do if [ -e "$f" ]; then echo 1; exit 0; fi; done; echo 0'
  PADS_LINK: '-collection:padslink={{.ROOT_DIR}}/apps/pads/link/{{if eq .LINK "1"}}on{{else}}off{{end}}'
  OPT: '{{.OPT | default "speed"}}'
  # The Python `task deps` sets up (pytest for the e2e suite).
  E2E_PYTHON: '{{if eq OS "windows"}}{{.ROOT_DIR}}/.deps/venv/Scripts/python.exe{{else}}{{.ROOT_DIR}}/.deps/venv/bin/python{{end}}'

tasks:
  pads:
    desc: 'Build Pads into .build/app/pads (OPT=none for a debug build).'
    sources:
      - '{{.ROOT_DIR}}/apps/pads/**/*.odin'
      - '{{.ROOT_DIR}}/app/**/*.odin'
      - '{{.ROOT_DIR}}/f_engine/**/*.odin'
      - '{{.ROOT_DIR}}/vendor/**/*.odin'
      - '{{.ROOT_DIR}}/vendor/imgui/*.a'
      - '{{.ROOT_DIR}}/vendor/imgui/*.lib'
    generates:
      - '{{.OUT}}/pads{{.EXE}}'
    # Up to date only if the sources are unchanged and it was built at this OPT
    # (a debug build is not an optimized one).
    status:
      - 'test "$(cat {{.OUT}}/pads.opt 2>/dev/null)" = "{{.OPT}}{{.LINK}}"'
    cmds:
      - mkdir -p {{.OUT}}
      - odin build {{.ROOT_DIR}}/apps/pads {{.COLLECTIONS}} {{.PADS_LINK}} -o:{{.OPT}} -debug -vet -strict-style -out:{{.OUT}}/pads{{.EXE}}  # -debug: crash reports name procedures and lines
      - echo {{.OPT}}{{.LINK}} > {{.OUT}}/pads.opt

  gallery:
    desc: 'Build and run the widget gallery (args go to it: task app:gallery -- --drive tests/app_ui/drive/gallery.txt --headless).'
    cmds:
      - mkdir -p {{.OUT}}
      - odin build {{.ROOT_DIR}}/apps/gallery {{.COLLECTIONS}} -o:{{.OPT}} -vet -strict-style -out:{{.OUT}}/gallery{{.EXE}}
      - '{{.OUT}}/gallery{{.EXE}} {{.CLI_ARGS}}'

  run:
    desc: Build and run Pads.
    deps: [pads]
    cmds:
      - '{{.OUT}}/pads{{.EXE}} {{.CLI_ARGS}}'

  drive:
    desc: 'Run Pads with a drive script: task app:drive -- tests/app_ui/drive/pads.txt (see docs/guides/app-layer.md).'
    deps: [pads]
    cmds:
      - '{{.OUT}}/pads{{.EXE}} --drive {{.CLI_ARGS}}'

  test:
    desc: 'Test the application layer: the headless packages (tests/app_*, tests/pads_*), the UI cases that need a window (apps/ui_tests), then Pads driven by its scripts.'
    cmds:
      - bash ./scripts/test.sh 'app_*' 'pads_*'
      - task: lint
      - task: ui-tests
      - task: pads-drive
      - task: e2e
        vars: {HEADLESS: '1'}

  lint:
    desc: 'Check the app code for ImGui calls given Odin strings where C wants cstrings (they crash).'
    cmds:
      - '{{if eq OS "windows"}}python{{else}}python3{{end}} scripts/lint_imgui.py apps app'

  e2e:
    desc: 'The end-to-end suite: Pads driven over its control socket by tests/e2e (pytest), as a person uses it; a crash fails the test with its report. A window on the Mac (watch it), headless elsewhere or with HEADLESS=1. Args go to pytest: task app:e2e -- -k browser -x'
    env:
      E2E_HEADLESS: '{{if .HEADLESS}}{{.HEADLESS}}{{else if eq OS "darwin"}}0{{else}}1{{end}}'
    cmds:
      - task: pads
        vars: {OPT: none}
      - '{{.E2E_PYTHON}} -m pytest tests/e2e -q {{.CLI_ARGS}}'

  ctl:
    desc: 'Pads under remote control (a window): type drive commands (click_item, drag_item, state, ...) one per line; each answer prints, and a crash prints its report. Args go to tests/e2e/ctl.py: task app:ctl -- --headless state'
    cmds:
      - task: pads
        vars: {OPT: none}
      - '{{.E2E_PYTHON}} tests/e2e/ctl.py {{.CLI_ARGS}}'

  pads-drive:
    desc: 'Run Pads headless on the simulated audio driver through tests/app_ui/drive/pads*.txt; fails if an expect line fails. Screenshots go to .build/app/pads_shots.'
    cmds:
      - task: pads
        vars: {OPT: none}
      - bash ./scripts/clap.sh # (the test plug-ins pads_plugin.txt plays)
      - for: { var: SCRIPTS }
        # Each script starts with no preferences of its own (favourites, recent projects), never the user's.
        cmd: 'rm -rf {{.OUT}}/pads_prefs && {{.OUT}}/pads{{.EXE}} --fake --headless --prefs {{.OUT}}/pads_prefs --drive "{{toSlash .ITEM}}" --out {{.OUT}}/pads_shots'
    vars:
      SCRIPTS:
        sh: ls tests/app_ui/drive/pads*.txt

  ui-tests:
    desc: 'Run the UI cases that need a window and a GPU, headless (or some: task app:ui-tests -- driven_input_reaches_widgets).'
    cmds:
      - mkdir -p {{.OUT}}
      - odin build {{.ROOT_DIR}}/apps/ui_tests {{.COLLECTIONS}} -o:none -vet -strict-style -out:{{.OUT}}/ui_tests{{.EXE}}
      - '{{.OUT}}/ui_tests{{.EXE}} --out {{.OUT}}/ui_tests_shots {{.CLI_ARGS}}'
